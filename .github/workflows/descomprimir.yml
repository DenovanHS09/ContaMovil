name: Aplicar icono ContaMovil y compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contamovil-icon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-icon-and-build:
    name: Aplicar icono y generar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preparar Python e instalar Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia para imágenes
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generar recursos Android del nuevo icono
        run: python .github/scripts/apply_launcher_icon.py

      - name: Guardar cambios del icono en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branding/contamovil-icon.png .github/scripts/apply_launcher_icon.py .github/workflows/descomprimir.yml app/src/main/res
          if git diff --cached --quiet; then
            echo "Los recursos del icono ya están actualizados."
          else
            git commit -m "Apply new ContaMovil launcher icon"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuración
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ContaMovil-debug-con-icono-nuevo
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
