
name: Aplicar actualizacion ContaMovil y compilar APK

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: "Nombre del ZIP que se subio a la raiz del repositorio"
        required: true
        default: "contamovil-update.zip"

permissions:
  contents: write

jobs:
  actualizar-y-compilar:
    name: Actualizar proyecto y generar APK
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validar y extraer ZIP
        env:
          UPDATE_ZIP: ${{ inputs.archivo }}
        run: |
          set -e

          python3 - <<'PY'
          import os
          import zipfile
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          archive = (root / os.environ["UPDATE_ZIP"]).resolve()
          staging = root / "_contamovil_staging"

          if root not in archive.parents or not archive.is_file():
              raise SystemExit("ERROR: No se encontro el ZIP en la raiz del repositorio.")

          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          with zipfile.ZipFile(archive, "r") as z:
              for info in z.infolist():
                  name = info.filename
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Ruta no permitida en ZIP: {name}")

                  mode = info.external_attr >> 16
                  if (mode & 0o170000) == 0o120000:
                      raise SystemExit(f"Enlace simbolico no permitido: {name}")

              z.extractall(staging)

          candidates = [
              p.parent for p in staging.rglob("settings.gradle.kts")
          ] + [
              p.parent for p in staging.rglob("settings.gradle")
          ]

          candidates = list(dict.fromkeys(candidates))

          if len(candidates) == 1:
              source = candidates[0]
          elif (staging / "settings.gradle.kts").is_file() or (staging / "settings.gradle").is_file():
              source = staging
          else:
              raise SystemExit("ERROR: No se encontro un proyecto Gradle valido en el ZIP.")

          for item in source.iterdir():
              if item.name in (".git", "_contamovil_staging"):
                  continue

              destination = root / item.name

              if item.is_dir():
                  shutil.copytree(item, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, destination)

          print("Proyecto extraido correctamente.")
          print(f"Origen detectado: {source}")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ejecutar pruebas
        run: gradle test

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Eliminar ZIP y archivos temporales
        env:
          UPDATE_ZIP: ${{ inputs.archivo }}
        run: |
          rm -f "$UPDATE_ZIP"
          rm -rf _contamovil_staging

      - name: Guardar cambios en rama dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Actualizar ContaMovil y redisenar interfaz"
            git push origin dev
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ContaMovil-dev-redisenado
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
